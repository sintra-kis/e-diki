# One-command local/own-server setup:   cp backend/.env.example backend/.env   (edit it)   then   docker compose up --build
# App: http://localhost:8080   (API under /api, health: /api/health)
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017      # overrides the value in .env
      TRUST_PROXY: "1"                      # nginx overwrites X-Forwarded-For
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo-data:
