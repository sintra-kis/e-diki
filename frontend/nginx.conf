server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # overwritten here, so TRUST_PROXY=1 is safe
    proxy_read_timeout 60s;
  }

  location / {
    try_files $uri /index.html;
  }
}
